[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edwh-bundler-plugin"
description = 'Python-only static file (js, css) bundler for `edwh`'
readme = "README.md"
requires-python = ">=3.12"
license-expression = "MIT"
keywords = []
authors = [
    { name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl" },
    { name = "Remco Boerma", email = "remco.b@educationwarehouse.nl" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
    "edwh >= 1.8.0",
    "edwarp >= 0.2.0",
]
version = "6.0.1"

[project.optional-dependencies]
dev = [
    "hatch",
    # "black",
    "pytest",
]

[project.urls]
Documentation = "https://github.com/educationwarehouse/edwh-bundler-plugin#readme"
Issues = "https://github.com/educationwarehouse/edwh-bundler-plugin/issues"
Source = "https://github.com/educationwarehouse/edwh-bundler-plugin"

# https://packaging.python.org/en/latest/guides/creating-and-discovering-plugins/#using-package-metadata
[project.entry-points."edwh.tasks"]
bundle = "edwh_bundler_plugin.bundler_plugin"

[tool.edwh.bundle]
js = [
    "https://unpkg.com/htmx.org@1.9.2/dist/htmx.min.js"
]

css = [
    "https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
]

[tool.edwh.bundle.config]
minify = true
filename = "bundled"
output-css = "static/css/$filename-$version.css"
output_js = "static/js/$filename-$version.js"
hash = true


[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "<auto>"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
feat = "Feature{s}"
fix = "Fix{es}"
break = "Breaking Change{s}"
docs = "Documentation"
perf = "Performance"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
build = "patch"
chore = "patch"
feat = "minor"
fix = "patch"
perf = "patch"
refactor = "patch"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "F", # pyflake error
    "E", # pycodestyle error
    "W", # pycodestyle warning
    "Q", # quotes
    "A", # builtins
    # "C4", # comprehensions - NO: doesn't allow dict()
    # "RET", # return - NO: annoying
    "SIM", # simplify
    "ARG", # unused arguments
    # "COM", # comma's - NO: annoying
    # "PTH", # use pathlib - NO: annoying
    "RUF", # ruff rules
]
unfixable = [
    # Don't touch unused imports
    "F401",
]

ignore = [
    "RUF013" # implicit Optional
]

[tool.isort]
profile = "black"
extend_skip_glob = ["*.bak/*"]

[tool.coverage.run]
source_pkgs = ["edwh_bundler_plugin", "tests"]
branch = true
parallel = true
omit = [
    "src/edwh_bundler_plugin/__about__.py",
]

[tool.coverage.paths]
edwh_bundler_plugin = ["src/edwh_bundler_plugin", "*/edwh-bundler-plugin/src/edwh_bundler_plugin"]
tests = ["tests", "*/edwh-bundler-plugin/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
